name: telepater postpost til raspberry pi
on:
  push:
    branches: [ main ]

jobs:
  telepater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: vi sætter deno op
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7"
          cache: true

      - name: vi henter lumes cache
        uses: actions/cache@v6
        with:
          path: _cache
          key: lume-cache-${{ github.run_id }}
          restore-keys: lume-cache-

      - name: vi bygger siden
        run: deno task lume

      - name: telepaterer til raspberry pi
        uses: easingthemes/ssh-deploy@5d8aeab1a56041e269567e67a08ce00df324a617 # v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "_site/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: "/var/www/post-post.dk/"
          SCRIPT_BEFORE: |
            whoami
            ls -al
          SCRIPT_AFTER: |
            whoami
            ls -al
            echo $RSYNC_STDOUT